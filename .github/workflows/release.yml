name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  detect-ui-changes:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check whether ui/ changed since the previous tag
        id: check
        run: |
          PREV_TAG=$(git tag --sort=-v:refname | grep -A1 "^${GITHUB_REF_NAME}$" | tail -n1)
          if [ -z "$PREV_TAG" ] || [ "$PREV_TAG" == "$GITHUB_REF_NAME" ]; then
            echo "No previous tag found — building UI image to be safe."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$PREV_TAG" "$GITHUB_REF_NAME" -- ui/; then
            echo "ui/ unchanged since $PREV_TAG — skipping UI build."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "ui/ changed since $PREV_TAG — building UI image."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            terrakubecommunity/terrakubed:latest
            terrakubecommunity/terrakubed:${{ github.ref_name }}

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true

  build-ui:
    needs: detect-ui-changes
    if: needs.detect-ui-changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./ui
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            REACT_APP_TERRAKUBE_VERSION=${{ github.ref_name }}
          tags: |
            terrakubecommunity/terrakubed-ui:latest
            terrakubecommunity/terrakubed-ui:${{ github.ref_name }}
